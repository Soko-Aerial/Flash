# JitPack build config for Flash.
# JitPack's default JDK is too old for AGP 9.3.1 — pin JDK 17 (the AGP floor).
# Android SDK + ANDROID_HOME are provided by JitPack; no signing / no publish repo needed.
#
# Publish every module the README lists in "Published modules" — all fifteen. The set has to
# be dependency-closed, not just "the ones a consumer names": core:engine api-depends on
# every other core module (including core:ptt and core:swarm), ui:callui api-depends on core:calling and
# uses ui:theme, ui:chat uses core:messaging + ui:theme AND publishes an
# implementation(project(":ui:platform-shims")) dependency, so an unpublished shims module
# leaves every ui-chat consumer with an unresolvable POM. A module missing from ~/.m2 is a
# transitive resolution failure for the consumer, not a missing feature.
#
# 1.1.0 added four (core:calling, ui:theme, ui:chat, ui:callui); the current dev tree adds
# core:ptt (artifact `core-ptt`, api-depended on by core:engine and, since ADR-058, ui:callui), ui:platform-shims
# (artifact `ui-platform-shims`, a runtime dependency of ui-chat), and core:swarm (artifact `core-swarm`).
# The ui:* modules build against compileSdk 37 while core:* stay on 35, so they are the ones to look at first if a
# JitPack build starts failing on an SDK platform it cannot install.
#
# The vendored webrtc-kmp fork (third_party/webrtc-kmp, an included build, ADR-034) is published FIRST, by its
# included-build task path, under Flash's own group and version (ADR-103). core:calling and ui:callui api-depend on
# it; their POMs name com.transfer.flash:webrtc-kmp-android / -jvm, which JitPack rewrites to
# com.github.<user>.<repo> like every other module. Before ADR-103 those POMs named com.shepeliev:webrtc-kmp-android:
# 0.125.11-flash-1, which exists nowhere a consumer can fetch it. Its native pieces stay on Maven Central:
# io.github.webrtc-sdk:android (Android) and dev.onvoid.webrtc:webrtc-java (desktop; the per-OS native classifier jar is
# the consumer's runtimeOnly choice, see README).
#
# -x test -x lint keeps builds fast and avoids test-only deps (bouncycastle,
# robolectric) failing the publish.
# gradle/gradle-daemon-jvm.properties pins the Gradle daemon to JDK 25 (updateDaemonJvm). JitPack runs JDK 17 and cannot fetch a 25 toolchain
# (v2.1.0-beta failed with "Unable to download toolchain ... languageVersion=25", foojay answered 400), so the file is dropped on JitPack only;
# the daemon then runs on the pinned JDK 17, which is what the library has always been published with.
before_install:
  - rm -f gradle/gradle-daemon-jvm.properties
jdk:
  - openjdk17
install:
  - ./gradlew :webrtc-kmp:webrtc-kmp:publishToMavenLocal :core:common:publishToMavenLocal :core:security:publishToMavenLocal :core:discovery:publishToMavenLocal :core:network:publishToMavenLocal :core:transfer:publishToMavenLocal :core:persistence:publishToMavenLocal :core:messaging:publishToMavenLocal :core:calling:publishToMavenLocal :core:ptt:publishToMavenLocal :core:swarm:publishToMavenLocal :core:engine:publishToMavenLocal :ui:theme:publishToMavenLocal :ui:platform-shims:publishToMavenLocal :ui:chat:publishToMavenLocal :ui:callui:publishToMavenLocal -x test -x lint
