[versions]
agp = "9.3.1"
coreKtx = "1.10.1"
coreSplashscreen = "1.0.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2025.12.00"
room = "2.8.4"
sqlcipher = "4.17.0"
# Phase 09B-2 (D5 = C's three sub-answers, given 2026-09-14): the ENCRYPTED JVM SQLite driver.
# `io.github.willena:sqlite-jdbc` is a fork of xerial's sqlite-jdbc — "SQLite JDBC library with
# encryption and authentication support" (github.com/Willena/sqlite-jdbc-crypt), Apache-2.0, so it
# satisfies both halves of the answer: real encryption (D5 = C's charter) and OSS-only licensing
# (the human ruled out Zetetic's commercial SQLCipher). NOT file-format compatible with Android's
# SQLCipher, which the human explicitly recorded as not required — desktop stores are per-device
# and are never transferred.
sqliteJdbcCrypt = "3.50.1.0"
sqliteKtx = "2.6.2"
datastore = "1.1.7"
# ADR-041: periodic background keepalive worker (investigation §1.3 D).
work = "2.10.1"
coroutinesTest = "1.10.2"
coroutines = "1.10.2"
robolectric = "4.16.1"
hilt = "2.60.1"
ksp = "2.3.11"
# Phase 14 (desktop mDNS). Pinned to the version PHASE-14 names; 3.6.3 exists on
# Maven Central but R10 authorises only what the phase specifies.
jmdns = "3.5.12"
# Desktop voice-note playback (ERROR-063, human-authorized 2026-09-16). Pure-Java MP4
# demux + AAC decoder for `.m4a` voice notes, which `javax.sound.sampled` cannot open.
# Alternatives ruled out in the decision: JAAD (GPL — incompatible with this repo's
# Apache-2.0 LICENSE), JavaCPP-ffmpeg (Apache-2.0 but heavy per-platform natives for a
# voice-note job), JavaFX media (same weight class), WAV voice notes (10x file size,
# changes the Android product). License verified BSD-2-Clause in the published jar
# (see progress 2026-09-16 entry). Zero runtime transitive dependencies, Java 6-era
# bytecode (no Kotlin-metadata or stdlib-bump risk against frozen 2.2.10).
jcodec = "0.2.5"
# Phase 17 (enacts D3 = Option A). Compose Multiplatform: the `composeResources/`
# directory, the generated `Res` accessors and the `painterResource(DrawableResource)`
# overload all come from here.
#
# 1.9.3 is deliberately NOT the latest (1.12.0 is). It is the newest CMP whose published
# artifacts still declare `kotlin-stdlib` at or BELOW this repo's frozen Kotlin 2.2.10.
# Read from each version's `components-resources-<v>.module` on Maven Central:
#   CMP 1.9.3   -> kotlin-stdlib 2.1.0   OK: below 2.2.10, so nothing is bumped
#   CMP 1.10.3  -> kotlin-stdlib 2.2.20  would raise stdlib above the compiler
#   CMP 1.11.1  -> kotlin-stdlib 2.3.20  built with Kotlin 2.3
#   CMP 1.12.0  -> kotlin-stdlib 2.3.20  built with Kotlin 2.3
# A 2.2.10 compiler cannot read metadata emitted by 2.3, so the two newest CMP releases
# are unusable here until the Kotlin version moves — which R10 does not allow in this phase.
#
# It also holds Jetpack Compose exactly where it is. CMP 1.9.3 maps to Jetpack Compose
# 1.9.4, which is BELOW the 1.10.0 that `composeBom = "2025.12.00"` pins, so Gradle keeps
# 1.10.0 and the three Android-only Compose consumers (:ui:chat, :ui:callui, :app) see no
# version change at all. CMP 1.10.3 would have pulled androidx.compose to 1.10.5.
#
# This is the verification D3 = A explicitly demanded ("Phase 06 must still verify the
# exact CMP version against Kotlin 2.2.10") and Phase 06 never performed.
jetbrainsCompose = "1.9.3"

# Phase 13B-2 (enacts D10 = Option A). The multiplatform I/O library that replaces the four
# `java.io.InputStream` / `RandomAccessFile` seams in `:core:transfer`, chosen over `kotlinx-io`
# on verified evidence rather than taste. Both candidates were inspected in the Gradle cache:
#
#   kotlinx-io-core 0.8.2  -> `kotlinx.io.files.FileSystem` offers only SEQUENTIAL access:
#                             `source(Path)` and `sink(Path, append)`. There is no `FileHandle`,
#                             no positional read/write, nothing equivalent to `RandomAccessFile`.
#                             `RandomAccessSinkHandle.writeAt(byteOffset, data)` — the seam this
#                             phase exists to re-type — cannot be expressed on it at all.
#   okio 3.x               -> `okio.FileHandle` has `read(Long, ByteArray, Int, Int)`,
#                             `write(Long, ByteArray, Int, Int)`, `resize(Long)`, `size()`,
#                             `flush()`. That is exactly the seam's shape.
#
# It is also pre-1.0 (0.8.x) versus stable 3.x, and these types enter a PUBLISHED ABI
# (JitPack; Phase 24 still pending), so the pre-1.0 candidate loses twice.
#
# 3.4.0, not the newest 3.17.0, and deliberately so: `androidx.datastore-preferences:1.1.7`
# ALREADY drags `com.squareup.okio:okio:3.4.0` onto `:app`'s runtime classpath through
# `datastore-core-okio-jvm` (verified with `:app:dependencyInsight --dependency okio`).
# Declaring 3.4.0 is therefore resolution-NEUTRAL — no version anywhere moves, which is what
# R10 requires of a phase that is not a version bump. Declaring 3.17.0 would have raised okio
# for every consumer that also uses DataStore. okio guarantees binary compatibility across 3.x,
# so a consumer already on a later 3.x still links against an ABI compiled here.
#
# Verified safe against the frozen toolchain (the trap Phase 17 hit with CMP):
#   okio 3.4.0  -> requires kotlin-stdlib 1.8.0, far BELOW this repo's Kotlin 2.2.10, so the
#                  stdlib is not bumped and a 2.2.10 compiler reads its metadata fine.
#   okio 3.17.0 -> requires kotlin-stdlib 2.1.21 (also safe, but see the resolution note above).
# Its Gradle metadata publishes `native` and `wasm` variants alongside `jvm`, so the
# Kotlin/Native target CONVENTIONS.md R6.1 has recommended since Phase 07 is not foreclosed.
okio = "3.4.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-adaptive-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite-ktx", version.ref = "sqliteKtx" }
# Phase 09B-1. `androidx.sqlite:sqlite` is the MULTIPLATFORM driver interface tier
# (SQLiteDriver/SQLiteConnection/SQLiteStatement) that Room 2.8.4's generated `_Impl` code targets;
# `sqlite-ktx` above is the Android-only Support layer (`androidx.sqlite.db.*`) and is NOT a
# substitute. Both are 2.6.2, so `sqliteKtx` is reused rather than a second version added (R10).
androidx-sqlite-core = { group = "androidx.sqlite", name = "sqlite", version.ref = "sqliteKtx" }
# TEST-ONLY, jvmTest only. BundledSQLiteDriver ships an UNENCRYPTED SQLite build. D5 = C forbids
# plaintext Flash data on desktop disk ("B without C"), so this alias may only ever appear in a
# jvmTest dependency block and only with `:memory:`. PHASE-09B verification gate 5 greps for it.
androidx-sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqliteKtx" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }
# Product dependency (NOT test-only, unlike `androidx-sqlite-bundled` above): the encrypted JVM
# driver `:core:persistence`'s jvmMain adapter is built over. Declared in jvmMain only.
sqlite-jdbc-crypt = { group = "io.github.willena", name = "sqlite-jdbc", version.ref = "sqliteJdbcCrypt" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
bouncycastle = { group = "org.bouncycastle", name = "bcprov-jdk18on", version = "1.81" }
bouncycastle-pkix = { group = "org.bouncycastle", name = "bcpkix-jdk18on", version = "1.81" }
# Phase 26 (ADR-035): Windows DPAPI access for the desktop identity vault (Crypt32Util).
# JVM-variant-only scope; the human-authorized new dependency of the P2 decision.
jna = { group = "net.java.dev.jna", name = "jna", version = "5.17.0" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version = "5.17.0" }
# ERROR-063 (human-authorized 2026-09-16): pure-Java MP4 demux + AAC decode for desktop
# voice notes. `implementation` in `:ui:platform-shims` jvmMain only — no public signature
# mentions it (PCM stays inside the player), so nothing leaks into the published POM.
jcodec = { group = "org.jcodec", name = "jcodec", version.ref = "jcodec" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
webrtc-kmp = { group = "com.shepeliev", name = "webrtc-kmp", version = "0.125.11" }
# Phase 14: desktop mDNS/DNS-SD. The group is `org.jmdns` — PHASE-14 specifies
# `io.jmdns:jmdns`, which does NOT exist (Maven Central returns 404 for its
# maven-metadata.xml). `javax.jmdns:jmdns` also exists but is abandoned at 3.4.1.
# Brings one transitive compile dependency: org.slf4j:slf4j-api:2.0.7.
jmdns = { group = "org.jmdns", name = "jmdns", version.ref = "jmdns" }
# Phase 13B-2 (D10 = A). The ROOT multiplatform module, never `okio-jvm`: Gradle's
# variant-aware resolution hands the `jvm` variant to both the android and the jvm() target,
# and would hand a klib to a future native target. `okio-jvm` would pin JVM-only and break
# that. Declared `api` in `:core:transfer`'s commonMain because `okio.Source` and
# `okio.FileHandle` appear in public signatures (ChunkSource, FileSourceOpener,
# RandomAccessSinkHandle) — `implementation` would keep them off a consumer's classpath.
okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }

[plugins]
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Phase 09B-1. The Room Gradle plugin, at the SAME 2.8.4 as the runtime and compiler (R10 — a new
# alias at an existing version ref, not a version change). It exists so each KMP target gets its own
# schema output: with a single global `ksp { arg("room.schemaLocation", …) }`, kspAndroid and kspJvm
# write the same path and can race under --max-workers=2.
androidx-room = { id = "androidx.room", version.ref = "room" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Phase 06 (KMP pilot). `com.android.library` is incompatible with the Kotlin
# Multiplatform plugin under AGP 9+, so a converted module switches to these two
# instead of adding to them. `android-library` stays: nine modules still use it.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Phase 17 (D3 = A). The Compose Multiplatform Gradle plugin. It is NOT a replacement for
# `kotlin-compose` above: since CMP 1.6 the Compose compiler ships with Kotlin itself, so a
# CMP module applies BOTH — `org.jetbrains.kotlin.plugin.compose` (compiler, must match the
# Kotlin version) and `org.jetbrains.compose` (the `compose` dependency DSL and the
# `composeResources/` -> `Res` accessor generation, versioned independently).
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "jetbrainsCompose" }

