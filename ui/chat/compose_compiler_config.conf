// Compose compiler stability configuration (OPT-O03-04).
//
// NOT WIRED INTO ANY build.gradle.kts ON PURPOSE. This file does nothing until a build file adds it:
//   composeCompiler { stabilityConfigurationFiles.add(rootProject.file("ui/chat/compose_compiler_config.conf")) }
// That is a build-file change and belongs to whoever owns the build files, not to this file.
//
// Before it is wired, note that these entries are a promise about the code, not a measurement.
// Declaring kotlin.collections.* stable in particular tells the compiler to treat any List/Set/Map as
// stable, and a wrong promise there is a stale-UI bug (a skipped recomposition), not a crash. Verify
// it on a device before trusting it, and keep every package listed here free of mutable state.
//
// Standard Kotlin collections treated as stable for Compose strong skipping.
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map
kotlin.collections.Collection

// Core messaging models — the declared classes hold no var, MutableList/Set/Map or snapshot state.
com.transfer.flash.core.messaging.model.*

// Core transfer models — same.
com.transfer.flash.core.transfer.model.*
