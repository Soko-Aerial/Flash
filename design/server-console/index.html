<head>
<meta charset="utf-8">

<link rel="stylesheet" href="css/screens.css">
<script>
  // Theme before first paint. The console opens in the app's dark palette unless the reviewer chose light.
  try {
    var saved = localStorage.getItem('flash.console.theme');
    document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
  } catch (e) {
    document.documentElement.dataset.theme = 'dark';
  }
</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px;max-width:60ch;margin:64px auto;">The Flash Hub console needs JavaScript. It loads no outside code: every script comes from this hub.</p></noscript>
</body>
