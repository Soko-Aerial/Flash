<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Flash invite</title>
  <link rel="stylesheet" href="/invite/assets/invite.css">
  <script src="/invite/assets/invite.js" defer></script>
</head>
<body>
  <main>
    <header><span class="mark" aria-hidden="true">F</span><span>Flash</span></header>
    <h1 id="title">Open your Flash invite</h1>
    <p id="description">Review the invitation in Flash before you accept it.</p>
    <div class="actions">
      <a class="primary" id="open" hidden>Open in Flash</a>
      <button id="copy" type="button" hidden>Copy invite link</button>
    </div>
    <p id="status" role="status"></p>
    <section aria-labelledby="install">
      <h2 id="install">Need Flash?</h2>
      <a href="https://github.com/Soko-Aerial/Flash/releases/latest" rel="noreferrer">Download Flash</a>
      <p>After installing, reopen this link or use the invite paste option in Flash.</p>
    </section>
  </main>
</body>
</html>
