name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + assemble debug
        # allTests exists only in the KMP modules (:core:common ... :ui:theme); testDebugUnitTest
        # exists only in the plain AGP modules (:app, :core:calling, :core:ptt, :ui:callui,
        # :sample:*). An unqualified task name runs where it exists and silently skips where it
        # does not, so one command alone covers half the repo — both are needed. Verified via
        # --dry-run: see docs/publishing/library-compliance-review.md addendum A1.
        # --continue: without it the first failing module hid every later one, so CI reported one
        # red test at a time (audit B5). Hardware-only tests self-skip when CI=true (set by Actions).
        run: ./gradlew allTests testDebugUnitTest assembleDebug --continue --no-daemon --stacktrace

      - name: Android lint (app)
        # Lint was driven to 0 errors on 2026-09-23 (audit 4.4); this keeps it there.
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/androidTests/
          if-no-files-found: ignore
